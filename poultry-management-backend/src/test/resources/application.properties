# Test configuration: a shared in-memory SQLite database, created fresh for each test run.
spring.datasource.url=jdbc:sqlite:file:poultrytest?mode=memory&cache=shared&foreign_keys=true
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
# never close the only connection: an in-memory database disappears when its last connection closes
spring.datasource.hikari.max-lifetime=0
spring.datasource.hikari.idle-timeout=0
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
poultry.timezone=Africa/Nairobi
poultry.alerts.daily-mortality-threshold-percent=0.50
poultry.alerts.critical-multiplier=2
poultry.demo-data.enabled=false
