# =====================================================================
# Poultry Management System - backend configuration (educational prototype)
# =====================================================================
spring.application.name=poultry-management-backend
server.port=8080

# ---------------------------------------------------------------------
# Database: SQLite file at ./data/poultry.db (relative to the folder you start the app from).
# The "data" folder is created automatically on startup (see PoultryManagementApplication).
# foreign_keys=true makes SQLite actually enforce foreign keys (it is OFF by default in SQLite).
# ---------------------------------------------------------------------
spring.datasource.url=jdbc:sqlite:data/poultry.db?foreign_keys=true
spring.datasource.driver-class-name=org.sqlite.JDBC

# SQLite allows only ONE writer at a time. A pool of exactly one connection makes every
# database operation wait its turn, which avoids "database is locked" errors in this small app.
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1

# Hibernate needs a SQLite "dialect" to generate correct SQL.
# It comes from the hibernate-community-dialects dependency in pom.xml.
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# The tables are created by src/main/resources/schema.sql (safe to run on every start:
# every statement uses CREATE ... IF NOT EXISTS). Hibernate must not change the schema itself.
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# Load entities inside services only (keeps the database connection short-lived).
spring.jpa.open-in-view=false

# Never leak stack traces or internal messages to the browser (errors are formatted by GlobalExceptionHandler).
server.error.include-stacktrace=never
server.error.include-message=never

# ---------------------------------------------------------------------
# Prototype settings (all documented in README.md)
# ---------------------------------------------------------------------
# Time zone used to decide what "today" means (timestamps are stored in UTC).
poultry.timezone=Africa/Nairobi

# HIGH MORTALITY ALERT THRESHOLD (one place only!):
# An alert is raised when the deaths recorded for one flock on one date are at least this
# percentage of the flock's INITIAL bird count.   daily % = deaths that day / initial birds * 100
# 0.50 is a placeholder for demonstration only. Real thresholds must come from qualified poultry professionals.
poultry.alerts.daily-mortality-threshold-percent=0.50
# An alert becomes CRITICAL (instead of WARNING) at threshold x this multiplier.
poultry.alerts.critical-multiplier=2

# Browser origins that may call this API (the Vite dev server). Comma separated.
poultry.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Set to true to load the synthetic demo data automatically at startup (only if not loaded before).
# You can also load it from the dashboard button or with: POST /api/demo/seed
poultry.demo-data.enabled=false
